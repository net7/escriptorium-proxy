openapi: 3.0.0
info:
  title: Transcription API
  description: API for document transcription and segmentation models
  version: 1.0.0
servers:
  - url: '{serverUrl}'
    variables:
      serverUrl:
        default: http://localhost:8080
        description: API server URL
paths:
  /api/models:
    get:
      summary: Get all available models
      description: Returns all available models with their specifications
      tags:
        - Models
      security:
        - TokenAuth: []
      responses:
        '200':
          description: A list of models
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    description: Total number of models
                  next:
                    type: string
                    nullable: true
                    description: URL to the next page of results
                  previous:
                    type: string
                    nullable: true
                    description: URL to the previous page of results
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Model'
              example:
                count: 32
                next: "http://localhost:8080/api/models/?page=2"
                previous: null
                results:
                  - pk: 255
                    name: "Trans Model 1"
                    file: "http://localhost:8080/media/models/3a01ee81/catmus-medieval.mlmodel"
                    file_size: 16332989
                    job: "Recognize"
                    owner: "admin"
                    training: false
                    versions: []
                    documents: [256]
                    accuracy_percent: 0.0
                    rights: "owner"
                    can_share: true
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  
  /api/create-project-and-document/:
    post:
      summary: Create project and document for transcription
      description: Performs preliminary steps for image transcription - creates a project, document, uploads the image, verifies segmentation and transcription models exist on the instance, creates a transcription object in the database. It sends a response to the user and triggers an asynchronous task for time-consuming operations (segmentation and transcription).
      tags:
        - Transcription
      security:
        - TokenAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                project:
                  type: string
                  description: Project name
                document:
                  type: string
                  description: Document name
                image:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Image file(s) to transcribe
                segmentation_model:
                  type: integer
                  description: ID of the segmentation model
                segmentation_model_file:
                  type: string
                  format: binary
                  description: Segmentation model file if uploading a new model
                transcription_model:
                  type: integer
                  description: ID of the transcription model
                transcription_model_file:
                  type: string
                  format: binary
                  description: Transcription model file if uploading a new model
                transcription_name:
                  type: string
                  description: Name of the transcription to be created
                format:
                  type: string
                  description: Desired format of the transcription (e.g., XML-TEI)
              required:
                - project
                - document
                - image
      responses:
        '200':
          description: Project and document created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  project:
                    $ref: '#/components/schemas/Project'
                  document:
                    $ref: '#/components/schemas/Document'
                  part:
                    $ref: '#/components/schemas/Part'
                  segmentation_model:
                    $ref: '#/components/schemas/Model'
                  transcription_model:
                    $ref: '#/components/schemas/Model'
                  transcription:
                    $ref: '#/components/schemas/Transcription'
                  job_id:
                    type: integer
                    description: ID of the created job
              example:
                project:
                  id: 262
                  owner: "admin"
                  slug: "prova67efae2c"
                  shared_with_users: []
                  shared_with_groups: []
                  name: "prova"
                  guidelines: null
                  created_at: "2025-04-04T10:02:20.870116Z"
                  updated_at: "2025-04-04T10:02:20.870206Z"
                  tags: []
                document:
                  pk: 256
                  name: "documento_prova"
                  project: "prova67efae2c"
                  transcriptions:
                    - pk: 335
                      name: "test_transcription"
                      archived: false
                      avg_confidence: null
                      created_at: "2025-04-04T10:02:21.836127Z"
                      comments: null
                    - pk: 334
                      name: "manual"
                      archived: false
                      avg_confidence: null
                      created_at: "2025-04-04T10:02:20.924546Z"
                      comments: null
                  main_script: "Latin"
                  read_direction: "ltr"
                  line_offset: 0
                  show_confidence_viz: false
                  valid_block_types: []
                  valid_line_types: []
                  valid_part_types: []
                  tags: []
                  created_at: "2025-04-04T10:02:20.900940Z"
                  updated_at: "2025-04-04T10:02:20.900957Z"
                  project_name: "prova"
                  project_id: 262
                  shared_with_users: []
                  shared_with_groups: []
                part:
                  pk: 207
                  name: ""
                  filename: "manoscritto.jpeg"
                  title: "Element 1"
                  typology: null
                  image:
                    uri: "/media/documents/256/manoscritto.jpeg"
                    size: [841, 1600]
                    thumbnails:
                      card: "/media/documents/256/manoscritto.jpeg.180x180_q85_crop-smart.jpg"
                  image_file_size: 316166
                  original_filename: "manoscritto.jpeg"
                  workflow: {}
                  order: 0
                  recoverable: false
                  transcription_progress: 0
                  source: ""
                  max_avg_confidence: null
                  comments: null
                  updated_at: "2025-04-04T10:02:21.087502Z"
                segmentation_model:
                  pk: 254
                  name: "Seg Model 1"
                  file: "/media/models/84f07c75/blla.mlmodel"
                  file_size: 5047020
                  job: "Segment"
                  owner: "admin"
                  training: false
                  versions: []
                  documents: []
                  accuracy_percent: 0.0
                  rights: "owner"
                  can_share: true
                transcription_model:
                  pk: 255
                  name: "Trans Model 1"
                  file: "/media/models/3a01ee81/catmus-medieval.mlmodel"
                  file_size: 16332989
                  job: "Recognize"
                  owner: "admin"
                  training: false
                  versions: []
                  documents: []
                  accuracy_percent: 0.0
                  rights: "owner"
                  can_share: true
                transcription:
                  pk: 335
                  name: "test_transcription"
                  archived: false
                  avg_confidence: null
                  created_at: "2025-04-04T10:02:21.836127Z"
                  comments: null
                job_id: 3
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  
  /api/get-job-status:
    get:
      summary: Get job status
      description: Receives a job ID and returns its status. If the job is complete, it returns the result with the transcription in the desired format.
      tags:
        - Jobs
      security:
        - TokenAuth: []
      parameters:
        - name: job_id
          in: query
          required: true
          schema:
            type: integer
          description: The ID of the job to check
      responses:
        '200':
          description: Job status retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [pending, in_progress, completed, failed]
                    description: Current status of the job
                  progress:
                    type: integer
                    description: Job progress percentage (0-100)
                  result:
                    type: object
                    description: Result data (available when job is completed)
              example:
                status: "completed"
                progress: 100
                result:
                  transcription_id: 335
                  format: "XML-TEI"
                  content: "<TEI xmlns='http://www.tei-c.org/ns/1.0'><teiHeader><fileDesc><titleStmt><title>Transcription of manuscript</title></titleStmt><publicationStmt><p>Unpublished manuscript</p></publicationStmt><sourceDesc><p>Transcription from digital image</p></sourceDesc></fileDesc></teiHeader><text><body><p>In principio creavit Deus caelum et terram. Terra autem erat inanis et vacua et tenebrae super faciem abyssi et spiritus Dei ferebatur super aquas.</p></body></text></TEI>"
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Job not found

components:
  securitySchemes:
    TokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Format should be 'Token {your-token}'
  
  schemas:
    Model:
      type: object
      properties:
        pk:
          type: integer
          description: Model ID
        name:
          type: string
          description: Model name
        file:
          type: string
          description: URL to the model file
        file_size:
          type: integer
          description: Size of the model file in bytes
        job:
          type: string
          description: Type of job the model performs (e.g., Segment, Recognize)
        owner:
          type: string
          description: Username of the model owner
        training:
          type: boolean
          description: Whether the model is in training
        versions:
          type: array
          items:
            type: integer
          description: IDs of previous versions of this model
        documents:
          type: array
          items:
            type: integer
          description: IDs of documents associated with this model
        accuracy_percent:
          type: number
          format: float
          description: Model accuracy percentage
        rights:
          type: string
          description: User's rights on this model
        can_share:
          type: boolean
          description: Whether the user can share this model
    
    Project:
      type: object
      properties:
        id:
          type: integer
          description: Project ID
        owner:
          type: string
          description: Project owner username
        slug:
          type: string
          description: Project slug
        shared_with_users:
          type: array
          items:
            type: string
          description: Users the project is shared with
        shared_with_groups:
          type: array
          items:
            type: string
          description: Groups the project is shared with
        name:
          type: string
          description: Project name
        guidelines:
          type: string
          nullable: true
          description: Project guidelines
        created_at:
          type: string
          format: date-time
          description: Project creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Project last update timestamp
        tags:
          type: array
          items:
            type: string
          description: Project tags
    
    Document:
      type: object
      properties:
        pk:
          type: integer
          description: Document ID
        name:
          type: string
          description: Document name
        project:
          type: string
          description: Project slug
        transcriptions:
          type: array
          items:
            $ref: '#/components/schemas/Transcription'
          description: Transcriptions associated with this document
        main_script:
          type: string
          description: Main script used in the document
        read_direction:
          type: string
          enum: [ltr, rtl]
          description: Reading direction
        line_offset:
          type: integer
          description: Line offset
        show_confidence_viz:
          type: boolean
          description: Whether to show confidence visualization
        valid_block_types:
          type: array
          items:
            type: string
          description: Valid block types
        valid_line_types:
          type: array
          items:
            type: string
          description: Valid line types
        valid_part_types:
          type: array
          items:
            type: string
          description: Valid part types
        tags:
          type: array
          items:
            type: string
          description: Document tags
        created_at:
          type: string
          format: date-time
          description: Document creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Document last update timestamp
        project_name:
          type: string
          description: Name of the project this document belongs to
        project_id:
          type: integer
          description: ID of the project this document belongs to
        shared_with_users:
          type: array
          items:
            type: string
          description: Users the document is shared with
        shared_with_groups:
          type: array
          items:
            type: string
          description: Groups the document is shared with
    
    Transcription:
      type: object
      properties:
        pk:
          type: integer
          description: Transcription ID
        name:
          type: string
          description: Transcription name
        archived:
          type: boolean
          description: Whether the transcription is archived
        avg_confidence:
          type: number
          format: float
          nullable: true
          description: Average confidence percentage of the transcription
        created_at:
          type: string
          format: date-time
          description: Transcription creation timestamp
        comments:
          type: string
          nullable: true
          description: Comments on the transcription
    
    Part:
      type: object
      properties:
        pk:
          type: integer
          description: Part ID
        name:
          type: string
          description: Part name
        filename:
          type: string
          description: Filename of the part
        title:
          type: string
          description: Part title
        typology:
          type: string
          nullable: true
          description: Part typology
        image:
          type: object
          properties:
            uri:
              type: string
              description: URI to the image
            size:
              type: array
              items:
                type: integer
              description: Image dimensions
            thumbnails:
              type: object
              properties:
                card:
                  type: string
                  description: Thumbnail URL
        image_file_size:
          type: integer
          description: Image file size in bytes
        original_filename:
          type: string
          description: Original filename
        workflow:
          type: object
          description: Workflow information
        order:
          type: integer
          description: Part order
        recoverable:
          type: boolean
          description: Whether the part is recoverable
        transcription_progress:
          type: integer
          description: Transcription progress percentage
        source:
          type: string
          description: Source information
        max_avg_confidence:
          type: number
          format: float
          nullable: true
          description: Maximum average confidence
        comments:
          type: string
          nullable: true
          description: Comments on the part
        updated_at:
          type: string
          format: date-time
          description: Part last update timestamp
      required:
        - file
        - type
