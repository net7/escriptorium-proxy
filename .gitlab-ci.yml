workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "stage"'

stages:
  - test
  - deploy

verify-proxy:
  stage: test
  image: docker:29-cli
  services:
    - name: docker:29-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    HEALTHCHECK_TCP_PORT: "2375"
  interruptible: true
  timeout: 30m
  before_script:
    - apk add --no-cache bash python3
    - docker info
  script:
    - python3 -m unittest discover -s ci -p 'test_deploy_staging.py'
    - docker build --pull --target development -f docker/Dockerfile.proxy -t proxy-test:$CI_COMMIT_SHA .
    - |
      docker run --rm --entrypoint sh \
        -e APP_ENV=testing -e APP_URL=http://localhost \
        -e APP_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
        -e CACHE_STORE=array -e SESSION_DRIVER=array -e QUEUE_CONNECTION=sync \
        -e DB_CONNECTION=sqlite -e DB_DATABASE=:memory: \
        proxy-test:$CI_COMMIT_SHA -ec '
          touch .env
          composer validate --no-check-publish
          composer check-platform-reqs
          composer audit
          vendor/bin/pest --compact --fail-on-warning
          bun run build
          bun audit
        '
    - docker build --target production -f docker/Dockerfile.proxy -t proxy-release:$CI_COMMIT_SHA .
    - |
      docker run --rm --entrypoint sh proxy-release:$CI_COMMIT_SHA -ec '
        composer check-platform-reqs --no-dev
        php -r '\''exit(PHP_VERSION_ID < 80427 || ini_get("session.upload_progress.enabled") !== "0" ? 1 : 0);'\''
        test -s public/build/manifest.json
        test ! -e .env
      '

deploy-staging:
  stage: deploy
  image: alpine:3.24
  needs: [verify-proxy]
  resource_group: escriptorium-staging
  interruptible: false
  timeout: 30m
  environment:
    name: staging
    url: https://escriptorium.netseven.work
  rules:
    - if: '$CI_COMMIT_BRANCH == "stage" && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
      allow_failure: false
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - cp "$STAGING_SSH_PRIVATE_KEY" ~/.ssh/id_ed25519
    - cp "$STAGING_SSH_KNOWN_HOSTS" ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
  script:
    - ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -i ~/.ssh/id_ed25519 -p 22 sysadmin@46.62.210.138 "deploy $CI_COMMIT_SHA"
