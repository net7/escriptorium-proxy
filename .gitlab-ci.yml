workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "stage"'

stages:
  - test
  - deploy

verify-proxy:
  stage: test
  image: php:8.4.27-fpm-alpine
  variables:
    APP_ENV: testing
    APP_URL: http://localhost
    APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    CACHE_STORE: array
    SESSION_DRIVER: array
    QUEUE_CONNECTION: sync
    DB_CONNECTION: sqlite
    DB_DATABASE: ":memory:"
  interruptible: true
  timeout: 20m
  before_script:
    - apk add --no-cache bash git python3 unzip
    - curl -fsSL https://composer.github.io/installer.sig -o /tmp/composer.sig
    - curl -fsSL https://getcomposer.org/installer -o /tmp/composer-setup.php
    - >-
      php -r 'exit(hash_file("sha384", "/tmp/composer-setup.php") === trim(file_get_contents("/tmp/composer.sig")) ? 0 : 1);'
    - php /tmp/composer-setup.php --version=2.11.1 --install-dir=/usr/local/bin --filename=composer
  script:
    - python3 -m unittest discover -s ci -p 'test_deploy_staging.py'
    - mkdir -p test-results
    - cd proxy
    - touch .env
    - composer install --no-interaction --prefer-dist --no-progress
    - composer validate --no-check-publish
    - composer check-platform-reqs
    - composer audit
    - vendor/bin/pest --compact --fail-on-warning --log-junit ../test-results/phpunit.xml
  artifacts:
    when: always
    reports:
      junit: test-results/phpunit.xml
    expire_in: 1 week

build-assets:
  stage: test
  image: oven/bun:1.4.4-alpine
  interruptible: true
  timeout: 15m
  before_script:
    - apk add --no-cache nodejs
  script:
    - cd proxy
    - bun install --frozen-lockfile
    - bun audit
    - bun run build
  artifacts:
    paths:
      - proxy/public/build/
    expire_in: 1 week

deploy-staging:
  stage: deploy
  image: alpine:3.24
  needs: [verify-proxy, build-assets]
  resource_group: escriptorium-staging
  interruptible: false
  timeout: 30m
  environment:
    name: staging
    url: https://escriptorium.netseven.work
  rules:
    - if: '$CI_COMMIT_BRANCH == "stage" && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
      allow_failure: false
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - cp "$STAGING_SSH_PRIVATE_KEY" ~/.ssh/id_ed25519
    - cp "$STAGING_SSH_KNOWN_HOSTS" ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
  script:
    - ssh -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -i ~/.ssh/id_ed25519 -p 22 sysadmin@46.62.210.138 "deploy $CI_COMMIT_SHA"
