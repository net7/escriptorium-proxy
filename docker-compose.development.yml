# Docker Compose - Development Environment
# Features: Hot reload for Laravel, exposed debug ports, phpMyAdmin
# Platform: Auto-detects ARM64 (Apple Silicon) and AMD64

services:
  # ===========================================
  # NGINX REVERSE PROXY
  # ===========================================
  nginx:
    build:
      context: ./docker/nginx
    ports:
      - "8080:80"
    volumes:
      - ./proxy/public:/var/www/html/public:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - proxy-php
      - escriptorium-web
    networks:
      - app-network
    restart: unless-stopped

  # ===========================================
  # LARAVEL PROXY SERVICES
  # ===========================================
  proxy-php:
    build:
      context: .
      dockerfile: docker/Dockerfile.proxy
      target: development
    volumes:
      - ./proxy:/var/www/html
      - /var/www/html/vendor
    env_file:
      - .env.development
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app-network
    restart: unless-stopped

  proxy-queue:
    build:
      context: .
      dockerfile: docker/Dockerfile.proxy
      target: development
    volumes:
      - ./proxy:/var/www/html
      - /var/www/html/vendor
    env_file:
      - .env.development
    command: php artisan queue:work --tries=3 --timeout=90
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app-network
    restart: unless-stopped

  proxy-vite:
    image: oven/bun:alpine
    working_dir: /app
    volumes:
      - ./proxy:/app
      - proxy-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "bun install && bun run dev --host 0.0.0.0"
    networks:
      - app-network

  # ===========================================
  # LARAVEL DATABASES
  # ===========================================
  mariadb:
    image: mariadb:11
    expose:
      - "3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-proxy}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      PMA_USER: ${DB_USERNAME:-laravel}
      PMA_PASSWORD: ${DB_PASSWORD:-secret}
      UPLOAD_LIMIT: 100M
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./docker/pgadmin/pgpass:/pgadmin4/pgpass:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  # ===========================================
  # ESCRIPTORIUM SERVICES (INTERNAL ONLY)
  # Build locally to support ARM64 (Apple Silicon)
  # ===========================================
  escriptorium-nginx:
    image: nginx:alpine
    ports:
      - "8082:80"
    volumes:
      - ./docker/nginx/escriptorium.conf:/etc/nginx/conf.d/default.conf:ro
      - escriptorium-static:/usr/src/app/static:ro
      - escriptorium-media:/usr/src/app/media:ro
    depends_on:
      - escriptorium-web
      - escriptorium-ws
    networks:
      - app-network
    restart: unless-stopped

  escriptorium-web:
    build:
      context: ./escriptorium
      dockerfile: Dockerfile
    platform: linux/arm64
    env_file:
      - ./escriptorium/variables.env
    volumes:
      - escriptorium-static:/usr/src/app/static
      - escriptorium-media:/usr/src/app/media
    command: uwsgi --ini /usr/src/app/uwsgi.ini
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app-network
    restart: unless-stopped

  escriptorium-ws:
    build:
      context: ./escriptorium
      dockerfile: Dockerfile
    platform: linux/arm64
    env_file:
      - ./escriptorium/variables.env
    volumes:
      - escriptorium-static:/usr/src/app/static
      - escriptorium-media:/usr/src/app/media
    command: daphne --bind 0.0.0.0 --port 5000 -v 1 escriptorium.asgi:application
    expose:
      - "5000"
    depends_on:
      - escriptorium-web
    networks:
      - app-network
    restart: unless-stopped

  # ===========================================
  # ESCRIPTORIUM DATABASES
  # ===========================================
  postgres:
    image: postgres:15-alpine
    platform: linux/arm64
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-escriptorium}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

  redis:
    image: redis:alpine
    platform: linux/arm64
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - app-network
    restart: unless-stopped

  # ===========================================
  # ESCRIPTORIUM CELERY WORKERS
  # Build locally to support ARM64 (Apple Silicon)
  # ===========================================
  celery-main:
    build:
      context: ./escriptorium
      dockerfile: Dockerfile
    platform: linux/arm64
    env_file:
      - ./escriptorium/variables.env
    environment:
      - OMP_NUM_THREADS=1
    volumes:
      - escriptorium-static:/usr/src/app/static
      - escriptorium-media:/usr/src/app/media
    command: "celery -A escriptorium worker -l INFO -E -Ofair --prefetch-multiplier 1 -Q default -c 2 --max-tasks-per-child=10"
    depends_on:
      - redis
      - postgres
    networks:
      - app-network
    restart: unless-stopped

  celery-gpu:
    build:
      context: ./escriptorium
      dockerfile: Dockerfile
    platform: linux/arm64
    env_file:
      - ./escriptorium/variables.env
    environment:
      - KRAKEN_TRAINING_DEVICE=cpu
    volumes:
      - escriptorium-static:/usr/src/app/static
      - escriptorium-media:/usr/src/app/media
    command: "celery -A escriptorium worker -l INFO -E -Ofair --prefetch-multiplier 1 -Q gpu -c 1 --max-tasks-per-child=1"
    shm_size: '3gb'
    depends_on:
      - redis
      - postgres
    networks:
      - app-network
    restart: unless-stopped

  # ===========================================
  # MONITORING (Development)
  # ===========================================
  flower:
    image: mher/flower:latest
    platform: linux/arm64
    ports:
      - "5555:5555"
    command: ["celery", "--broker=redis://redis:6379/0", "flower", "--port=5555"]
    depends_on:
      - redis
    networks:
      - app-network
    restart: unless-stopped

  mail:
    build:
      context: ./escriptorium/exim
      dockerfile: Dockerfile
    platform: linux/arm64
    expose:
      - "25"
    environment:
      - PRIMARY_HOST=${DOMAIN:-localhost}
      - ALLOWED_HOSTS=escriptorium-web ; celery-main ; docker0
    networks:
      - app-network
    restart: unless-stopped

# ===========================================
# NETWORKS
# ===========================================
networks:
  app-network:
    driver: bridge

# ===========================================
# VOLUMES
# ===========================================
volumes:
  mariadb-data:
  postgres-data:
  redis-data:
  escriptorium-static:
  escriptorium-media:
  proxy-node-modules:
  pgadmin-data:
