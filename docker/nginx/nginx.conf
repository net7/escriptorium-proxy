# Laravel Proxy Nginx Configuration
# Only routes to Laravel - eScriptorium is called internally by Laravel via HTTP

server {
    listen 80;
    server_name _;
    charset utf-8;
    
    # Docker DNS resolver for dynamic resolution
    resolver 127.0.0.11 valid=30s ipv6=off;
    
    root /var/www/html/public;
    index index.php;
    
    client_max_body_size 150M;
    
    # Gzip compression
    gzip on;
    gzip_static on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_vary on;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Laravel application - Main entry point
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    # PHP-FPM for Laravel
    location ~ \.php$ {
        set $php_upstream proxy-php:9000;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        
        # Timeouts for long-running requests
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
    }
    
    # Laravel static assets
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    
    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
    
    # Deny access to sensitive Laravel directories
    location ~ ^/(storage|bootstrap/cache) {
        deny all;
    }
}
