# Upstream definitions
# eScriptorium - Internal only, NOT exposed externally
upstream escriptorium {
    server escriptorium-web:8000;
}

upstream escriptorium_websocket {
    server escriptorium-ws:5000;
}

# Laravel Proxy
upstream laravel {
    server proxy-php:9000;
}

# phpMyAdmin (development only)
upstream phpmyadmin {
    server phpmyadmin:80;
}

server {
    listen 80;
    server_name _;
    charset utf-8;
    
    root /var/www/html/public;
    index index.php;
    
    client_max_body_size 150M;
    
    # Gzip compression
    gzip on;
    gzip_static on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_vary on;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Laravel application - Main entry point (exposed externally)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    
    # PHP-FPM for Laravel
    location ~ \.php$ {
        fastcgi_pass laravel;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        
        # Timeouts for long-running requests
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
    }
    
    # Laravel static assets
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    
    # phpMyAdmin - Development only (should be removed or disabled in production)
    location /phpmyadmin/ {
        proxy_pass http://phpmyadmin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
    
    # Deny access to sensitive Laravel directories
    location ~ ^/(storage|bootstrap/cache) {
        deny all;
    }
}
